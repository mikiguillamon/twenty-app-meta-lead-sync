name: Static validation (does not touch Twenty or Meta)
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.5.0'
      - run: corepack enable
      - run: yarn install
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build
